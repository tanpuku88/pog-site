    <text x="40" y="136" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#3c4a42">○ 血統メモ</text>
    <text x="40" y="166" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#3c4a42">▲ 指名候補</text>
