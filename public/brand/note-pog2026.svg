  <text x="40" y="186" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-weight="800" font-size="26" fill="#e8f1eb">新馬・指名馬の解説ノート</text>
  <rect x="40" y="206" width="112" height="4" rx="2" fill="url(#gd)"/>
