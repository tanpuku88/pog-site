name: 種牡馬の名鑑データを集める

on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "この日数より古いデータだけ読み直す"
        required: false
        default: "30"

concurrency:
  group: build-sire-profiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:sires
        env:
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
          # ほかの取り込みと重なってもnetkeibaに負担をかけないよう間隔を広めに
          NETKEIBA_INTERVAL_MS: "5000"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 集めたデータを、このワークフローを動かしたブランチにコミットする（main には直接入れない）
      - if: ${{ always() && github.ref_name != 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sire-profiles.json
          git diff --cached --quiet || (git commit -m "種牡馬の名鑑データを更新" && git push origin HEAD:${{ github.ref_name }})
