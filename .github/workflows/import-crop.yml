name: 世代の馬をまとめて取り込む

on:
  workflow_dispatch:
    inputs:
      crop_year:
        description: "生まれ年（空なら今シーズンの2歳世代）"
        required: false
        default: ""
      probe:
        description: "調査だけする（取り込まない）"
        type: boolean
        default: false
  schedule:
    # 毎週月曜 4:00（日本時間）。新しく登録された馬を続きから追加する
    - cron: "0 19 * * 0"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ inputs.probe }}
        run: npm run probe:netkeiba
      - if: ${{ !inputs.probe }}
        id: crop
        run: npm run import:crop
        env:
          CROP_YEAR: ${{ inputs.crop_year }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 時間切れで途中までだったら、続きを自動でもう一度動かす
      - if: ${{ !inputs.probe && steps.crop.outputs.more == 'true' }}
        run: gh workflow run import-crop.yml --ref main -f crop_year="${{ inputs.crop_year }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
